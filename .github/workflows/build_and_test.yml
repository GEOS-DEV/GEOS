name: Build and Test Configuration
on:
  workflow_call:
    inputs:
      BUILD_AND_TEST_CLI_ARGS:
        required: false
        type: string
      BUILD_SHARED_LIBS:
        required: false
        type: string
        default: 'ON'
      BUILD_TYPE:
        required: false
        type: string
        default: build
      CMAKE_BUILD_TYPE:
        required: true
        type: string
      CODE_COVERAGE:
        required: false
        type: boolean
        default: false
      DOCKER_IMAGE_TAG:
        required: true
        type: string
      DOCKER_REPOSITORY:
        required: true
        type: string
      DOCKER_RUN_ARGS:
        required: false
        type: string
      ENABLE_HYPRE:
        required: false
        type: string
      ENABLE_HYPRE_DEVICE:
        required: false
        type: string
      ENABLE_TRILINOS:
        required: false
        type: string
      HOST_CONFIG:
        required: false
        type: string
      NPROC:
        required: false
        type: string
        default: ''
      RUNS_ON:
        required: true
        type: string
      USE_SCCACHE:
        required: false
        type: boolean
        default: true
      REQUIRED_LABEL:
        required: false
        type: string
      LOCAL_BASELINE_DIR:
        required: false
        type: string
      BUILD_GENERATOR:
        required: false
        type: string
        default: '--ninja'
      GEOS_ENABLE_BOUNDS_CHECK:
        required: false
        type: string
    secrets:
      SCCACHE_BUCKET:
        required: false
      SCCACHE_GCS_BUCKET:
        required: false
      SCCACHE_ACCESS_KEY_ID:
        required: false
      SCCACHE_SECRET_ACCESS_KEY:
        required: false
      SCCACHE_REGION:
        required: false
      SCCACHE_S3_USE_SSL:
        required: false
      SCCACHE_GCS_CREDENTIALS_JSON:
        required: false
      SCCACHE_CONFIG_TOML:
        required: false
      CLOUDFLARE_R2_ACCESS_KEY_ID:
        required: false
      CLOUDFLARE_R2_SECRET_ACCESS_KEY:
        required: false
      SCCACHE_ENDPOINT:
        required: false
      CODECOV_TOKEN:
        required: false
      GOOGLE_CLOUD_GCP:
        required: false
jobs:
  build_test_deploy:
    runs-on: ${{ inputs.RUNS_ON }}
    steps:
    - name: does_pr_have_necessary_labels
      if: ${{inputs.REQUIRED_LABEL && github.event_name == 'pull_request'}}
      run: |
        set -euo pipefail

        pr_json='${{ toJson(github.event.pull_request) }}'
        LABELS=$(jq -crM '[.labels[].name]' <<< "${pr_json}")
        echo " the labels are ${LABELS}"
        echo " the required label is ${{inputs.REQUIRED_LABEL}}"
        if [[ "${LABELS}" != *"${{inputs.REQUIRED_LABEL}}"* ]]; then
          exit 1
        fi

    - name: 'Cleanup build folder'
      run: |
        pwd
        echo "cleaning ${GITHUB_WORKSPACE}"
        ls -la ./
        rm -rf ./* ./.*|| true
        echo "expecting ${GITHUB_WORKSPACE} to be empty"
        ls -la ./

    - name: Checkout Repository
      uses: actions/checkout@v4.2.2
      with:
        submodules: true
        lfs: ${{ inputs.BUILD_TYPE == 'integrated_tests' }}
        fetch-depth: 1

    - id: sccache_config
      name: Resolve sccache configuration
      env:
        SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
        SCCACHE_GCS_BUCKET: ${{ secrets.SCCACHE_GCS_BUCKET }}
        SCCACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
        SCCACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
        SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
        SCCACHE_S3_USE_SSL: ${{ secrets.SCCACHE_S3_USE_SSL }}
        SCCACHE_GCS_CREDENTIALS_JSON: ${{ secrets.SCCACHE_GCS_CREDENTIALS_JSON }}
        SCCACHE_CONFIG_TOML: ${{ secrets.SCCACHE_CONFIG_TOML }}
        CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
        CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
        GOOGLE_CLOUD_GCP: ${{ secrets.GOOGLE_CLOUD_GCP }}
      run: |
        set -euo pipefail

        use_sccache=false
        sccache_backend=none
        sccache_bucket=
        sccache_endpoint=
        sccache_region=
        sccache_s3_use_ssl=
        sccache_credentials_file=
        sccache_config_file=

        if [[ "${{ inputs.USE_SCCACHE }}" == "true" ]]; then
          resolved_access_key_id="${SCCACHE_ACCESS_KEY_ID:-${CLOUDFLARE_R2_ACCESS_KEY_ID:-}}"
          resolved_secret_access_key="${SCCACHE_SECRET_ACCESS_KEY:-${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}}"
          resolved_gcs_credentials_json="${SCCACHE_GCS_CREDENTIALS_JSON:-${GOOGLE_CLOUD_GCP:-}}"

          if [[ -n "${SCCACHE_CONFIG_TOML:-}" ]]; then
            use_sccache=true
            sccache_backend=custom
            sccache_config_file=".sccache-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.toml"
            printf '%s' "${SCCACHE_CONFIG_TOML}" > "${GITHUB_WORKSPACE}/${sccache_config_file}"
            chmod 600 "${GITHUB_WORKSPACE}/${sccache_config_file}"
          elif [[ -n "${SCCACHE_BUCKET:-}" && -n "${resolved_access_key_id}" && -n "${resolved_secret_access_key}" ]]; then
            use_sccache=true
            sccache_backend=s3
            sccache_bucket="${SCCACHE_BUCKET}"
            sccache_endpoint="${SCCACHE_ENDPOINT}"
            sccache_region="${SCCACHE_REGION:-auto}"
            sccache_s3_use_ssl="${SCCACHE_S3_USE_SSL:-true}"
          elif [[ -n "${resolved_gcs_credentials_json}" ]]; then
            use_sccache=true
            sccache_backend=gcs
            sccache_bucket="${SCCACHE_GCS_BUCKET:-geos-dev}"
            sccache_credentials_file=".sccache-gcs-creds-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            printf '%s' "${resolved_gcs_credentials_json}" > "${GITHUB_WORKSPACE}/${sccache_credentials_file}"
            chmod 600 "${GITHUB_WORKSPACE}/${sccache_credentials_file}"
          else
            missing=()

            if [[ -z "${SCCACHE_CONFIG_TOML:-}" ]]; then
              missing+=("SCCACHE_CONFIG_TOML (for custom backend)")
            fi
            if [[ -z "${SCCACHE_BUCKET:-}" || -z "${resolved_access_key_id}" || -z "${resolved_secret_access_key}" ]]; then
              missing+=("S3 secrets (SCCACHE_BUCKET + ACCESS_KEY_ID + SECRET_ACCESS_KEY)")
            fi
            if [[ -z "${resolved_gcs_credentials_json}" ]]; then
              missing+=("GCS credentials JSON")
            fi

            echo "::warning::Missing sccache configuration; expected one of: ${missing[*]}. Disabling sccache for this run."
          fi

        fi

        {
          echo "use_sccache=${use_sccache}"
          echo "sccache_backend=${sccache_backend}"
          echo "sccache_bucket=${sccache_bucket}"
          echo "sccache_endpoint=${sccache_endpoint}"
          echo "sccache_region=${sccache_region}"
          echo "sccache_s3_use_ssl=${sccache_s3_use_ssl}"
          echo "sccache_credentials_file=${sccache_credentials_file}"
          echo "sccache_config_file=${sccache_config_file}"
        } >> "$GITHUB_OUTPUT"

    - name: Print environment
      run: printenv

    - name: Build, test, deploy.
      env:
        SCCACHE_BUCKET: ${{ steps.sccache_config.outputs.sccache_bucket }}
        AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        SCCACHE_ENDPOINT: ${{ steps.sccache_config.outputs.sccache_endpoint }}
        SCCACHE_S3_USE_SSL: ${{ steps.sccache_config.outputs.sccache_s3_use_ssl }}
        SCCACHE_REGION: ${{ steps.sccache_config.outputs.sccache_region }}
      run: |
        # Those two bash arrays will be populated depending on the required options,
        # and expended as CLI arguments for the docker and scripts calls.
        docker_args=()
        script_args=()
        HAS_DATA_EXCHANGE=false
        DATA_BASENAME=
        DATA_EXCHANGE_DIR=

        if [[ -n "${{ inputs.NPROC }}" ]]; then
          NPROC=${{ inputs.NPROC }}
          script_args+=(--nproc ${NPROC})
        fi

        if [[ -n "${{ inputs.BUILD_GENERATOR }}" ]]; then
          script_args+=(${{ inputs.BUILD_GENERATOR }})
        fi

        docker_args+=(${{ inputs.DOCKER_RUN_ARGS }})

        COMMIT=${{ github.event.pull_request.head.sha }}
        SHORT_COMMIT=${COMMIT:0:7}
        script_args+=(--install-dir-basename GEOS-${SHORT_COMMIT})

        if [[ "${{ inputs.BUILD_TYPE }}" == "integrated_tests" ]]; then
          HAS_DATA_EXCHANGE=true

          DATA_BASENAME=integratedTests-pr${{ github.event.number }}-${{ github.run_number }}-${SHORT_COMMIT}.tar.gz
          script_args+=(--run-integrated-tests)
          
          script_args+=(--data-basename ${DATA_BASENAME})

          DATA_EXCHANGE_DIR=${GITHUB_WORKSPACE}/geos-exchange  # Exchange folder outside of the container
          if [ ! -d "${DATA_EXCHANGE_DIR}" ]; then
            mkdir -p ${DATA_EXCHANGE_DIR}
          fi
          DATA_EXCHANGE_MOUNT_POINT=/tmp/exchange  # Exchange folder inside of the container
          docker_args+=(--volume=${DATA_EXCHANGE_DIR}:${DATA_EXCHANGE_MOUNT_POINT})
          script_args+=(--exchange-dir ${DATA_EXCHANGE_MOUNT_POINT})
        fi

        HOST_CONFIG=${{ inputs.HOST_CONFIG }}
        script_args+=(${HOST_CONFIG:+"--host-config ${HOST_CONFIG}"})

        if [[ "${{ steps.sccache_config.outputs.use_sccache }}" == "true" ]]; then
          if [[ -n "${SCCACHE_BUCKET}" ]]; then
            docker_args+=(-e SCCACHE_BUCKET)
          fi

          if [[ "${{ steps.sccache_config.outputs.sccache_backend }}" == "s3" ]]; then
            docker_args+=(-e AWS_ACCESS_KEY_ID)
            docker_args+=(-e AWS_SECRET_ACCESS_KEY)
            if [[ -n "${SCCACHE_ENDPOINT}" ]]; then
              docker_args+=(-e SCCACHE_ENDPOINT)
            fi
            if [[ -n "${SCCACHE_S3_USE_SSL}" ]]; then
              docker_args+=(-e SCCACHE_S3_USE_SSL)
            fi
            if [[ -n "${SCCACHE_REGION}" ]]; then
              docker_args+=(-e SCCACHE_REGION)
            fi
          fi

          if [[ "${{ steps.sccache_config.outputs.sccache_backend }}" == "gcs" ]]; then
            script_args+=(--sccache-credentials "${{ steps.sccache_config.outputs.sccache_credentials_file }}")
          fi

          if [[ "${{ steps.sccache_config.outputs.sccache_backend }}" == "custom" ]]; then
            script_args+=(--sccache-config "${{ steps.sccache_config.outputs.sccache_config_file }}")
          fi
        fi

        # We need to know where the code folder is mounted inside the container so we can run the script at the proper location!
        # Since this information is repeated twice, we use a variable.
        GITHUB_WORKSPACE_MOUNT_POINT=/tmp/geos
        docker_args+=(--volume=${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE_MOUNT_POINT})
        script_args+=(--repository ${GITHUB_WORKSPACE_MOUNT_POINT})

        if [ ! -z "${{ inputs.GEOS_ENABLE_BOUNDS_CHECK }}" ]; then
          script_args+=(--geos-enable-bounds-check "${{ inputs.GEOS_ENABLE_BOUNDS_CHECK }}")
        fi

        # The linear algebra environment variables (ENABLE_HYPRE, ENABLE_HYPRE_DEVICE & ENABLE_TRILINOS)
        # are passed as scripts parameters. Specific care must be taken to be sure
        # there's no conflict with the host-config files.

        # Hypre
        ENABLE_HYPRE=${{ inputs.ENABLE_HYPRE }}
        if [ ! -z "${{ inputs.ENABLE_HYPRE }}" ]; then
          script_args+=(--enable-hypre "${{ inputs.ENABLE_HYPRE }}")
        fi

        # Trilinos
        ENABLE_TRILINOS=${{ inputs.ENABLE_TRILINOS }}
        docker_args+=(-e ENABLE_HYPRE=${ENABLE_HYPRE:-OFF})
        docker_args+=(-e ENABLE_HYPRE_DEVICE=${ENABLE_HYPRE_DEVICE:-CPU})
        docker_args+=(-e ENABLE_TRILINOS=${ENABLE_TRILINOS:-ON})
        docker_args+=(-e GEOS_BUILD_SHARED_LIBS=${{ inputs.BUILD_SHARED_LIBS }})

        if [ ! -z "${{ inputs.ENABLE_TRILINOS }}" ]; then
          script_args+=(--enable-trilinos "${{ inputs.ENABLE_TRILINOS }}")
        fi

        # ENABLE_HYPRE_DEVICE
        ENABLE_HYPRE_DEVICE=${{ inputs.ENABLE_HYPRE_DEVICE }}
        if [ ! -z "${{ inputs.ENABLE_HYPRE_DEVICE }}" ]; then
          script_args+=(--enable-hypre-device "${{ inputs.ENABLE_HYPRE_DEVICE }}")
        fi

        docker_args+=(--cap-add=SYS_PTRACE --rm)

        script_args+=(--cmake-build-type ${{ inputs.CMAKE_BUILD_TYPE }})
        script_args+=(${{ inputs.BUILD_AND_TEST_CLI_ARGS }})


        DOCKER_REPOSITORY=${{ inputs.DOCKER_REPOSITORY }}
        SPLIT_DOCKER_REPOSITORY=(${DOCKER_REPOSITORY//// })
        CONTAINER_NAME=geosx_build_${SPLIT_DOCKER_REPOSITORY[1]}_${GITHUB_SHA:0:7}_${{ inputs.CMAKE_BUILD_TYPE }}
        echo "CONTAINER_NAME: ${CONTAINER_NAME}"
        if [ "$(docker ps -aq -f name=${CONTAINER_NAME})" ]; then
          docker rm -f ${CONTAINER_NAME}
        fi
        docker_args+=(--name ${CONTAINER_NAME})


        if ${{ inputs.CODE_COVERAGE }} == 'true'; then
          script_args+=(--code-coverage)
        fi

        if [[ -n "${{ inputs.LOCAL_BASELINE_DIR }}" ]]; then
          # Extract the 'baseline' value

          # Define the path to the YAML file
          YAML_FILE_PATH="${GITHUB_WORKSPACE}/.integrated_tests.yaml"

          # Verify the YAML file path
          if [[ ! -f "${YAML_FILE_PATH}" ]]; then
            echo "Error: File $YAML_FILE_PATH does not exist."
          else
            echo "Found integratedTests file: $YAML_FILE_PATH."
          fi

          # Extract the baseline field
          BASELINE_FULL_PATH=$(grep -A 2 'baselines:' "${YAML_FILE_PATH}" | grep 'baseline:' | awk '{print $2}')

          # Remove the 'integratedTests/' prefix
          BASELINE_TAG=${BASELINE_FULL_PATH#integratedTests/}
          echo "Baseline: ${BASELINE_TAG}"

          # Extract the folder name
          PR_NUMBER=$(echo "$BASELINE_TAG" | grep -o 'pr[0-9]*')
          PR_BASELINE_FOLDER_NAME=baselines_${PR_NUMBER}
          echo "Baseline folder name: ${PR_BASELINE_FOLDER_NAME}"

          CURRENT_BASELINE_DIR=${{ inputs.LOCAL_BASELINE_DIR }}/${PR_BASELINE_FOLDER_NAME}
          echo "Current baseline dir: ${CURRENT_BASELINE_DIR}"

          if [ -d ${CURRENT_BASELINE_DIR} ];then
            echo "Current baseline dir found."
            ls -l ${CURRENT_BASELINE_DIR}

            # We defined a mount point and mount it read-only inside the container.
            CURRENT_BASELINE_DIR_MOUNT=/tmp/geos/baselines
            docker_args+=(--volume=${CURRENT_BASELINE_DIR}:${CURRENT_BASELINE_DIR_MOUNT}:ro)
          else
            echo "Current baselines directory (${CURRENT_BASELINE_DIR}) not found"
          fi
        fi

        echo running "docker run \
          --user nobody \
          ${docker_args[@]} \
          -h=`hostname` \
          ${{ inputs.DOCKER_REPOSITORY }}:${{ inputs.DOCKER_IMAGE_TAG }} \
          ${GITHUB_WORKSPACE_MOUNT_POINT}/scripts/ci_build_and_test_in_container.sh \
          ${script_args[@]}"

        # GHA set `-e` to bash scripts by default to fail asap,
        # but for this precise call, we want to deal with it more precisely
        set +e
        docker run \
          ${docker_args[@]} \
          -h=`hostname` \
          ${{ inputs.DOCKER_REPOSITORY }}:${{ inputs.DOCKER_IMAGE_TAG }} \
          ${GITHUB_WORKSPACE_MOUNT_POINT}/scripts/ci_build_and_test_in_container.sh \
          ${script_args[@]}
        EXIT_STATUS=$?
        echo "Received exit status ${EXIT_STATUS} from the build process."
        set -e

        if [[ "${HAS_DATA_EXCHANGE}" == "true" ]]; then
          if [[ "${{ inputs.BUILD_TYPE }}" = "integrated_tests" || ${EXIT_STATUS} -eq 0 ]]; then
            if [[ -f ${DATA_EXCHANGE_DIR}/${DATA_BASENAME} ]]; then
              echo "Generated artifact at ${DATA_EXCHANGE_DIR}/${DATA_BASENAME}"
            fi

            if [ -f ${DATA_EXCHANGE_DIR}/test_logs_${DATA_BASENAME} ]; then
              echo "Generated integrated test logs at ${DATA_EXCHANGE_DIR}/test_logs_${DATA_BASENAME}"
            fi

            if [ -f ${DATA_EXCHANGE_DIR}/baseline_${DATA_BASENAME} ];then
              if [[ -n "${{ inputs.LOCAL_BASELINE_DIR }}" ]]; then
                # 1. We copy the baselines to a local directory to store them

                # 1.a Create the new target directory to store the new baselines
                THIS_PR_NUMBER=pr${{ github.event.number }}
                NEW_PR_BASELINE_FOLDER_NAME=baselines_${THIS_PR_NUMBER}
                TARGET_DIR="${{ inputs.LOCAL_BASELINE_DIR }}/${NEW_PR_BASELINE_FOLDER_NAME}"
                echo "Create folder ${TARGET_DIR}"
                mkdir -p "${TARGET_DIR}"

                # 1.b We copy the new baselines to the new target directory
                SOURCE_FILE="${DATA_EXCHANGE_DIR}/baseline_${DATA_BASENAME}"
                echo "Copy ${SOURCE_FILE} to ${TARGET_DIR}"
                cp "${SOURCE_FILE}" "${TARGET_DIR}"
              fi

              # 2. We push the baselines to the cloud
              CLOUDSDK_PYTHON=python3 gcloud storage cp --quiet -a publicRead ${DATA_EXCHANGE_DIR}/baseline_${DATA_BASENAME} gs://${{ inputs.GCP_BUCKET }}/
              echo "Download test baselines here: https://storage.googleapis.com/${{ inputs.GCP_BUCKET }}/baseline_${DATA_BASENAME}"
              echo "New baseline ID: baseline_${DATA_BASENAME::-7}"
            else
              echo "Baselines ${DATA_EXCHANGE_DIR}/baseline_${DATA_BASENAME} were not uploaded. Likeyly because no rebaseline was necessary."
            fi
          fi
        fi

        exit ${EXIT_STATUS}

    - name: Prepare pip for Codecov
      if: inputs.CODE_COVERAGE
      run: |
        set -euxo pipefail
        python3 --version
        python3 -m ensurepip --upgrade || true
        python3 -m pip --version
        mkdir -p "${RUNNER_TEMP}/codecov-bin"
        cat > "${RUNNER_TEMP}/codecov-bin/pip" <<'EOF'
        #!/usr/bin/env bash
        exec python3 -m pip "$@"
        EOF
        chmod +x "${RUNNER_TEMP}/codecov-bin/pip"
        echo "${RUNNER_TEMP}/codecov-bin" >> "${GITHUB_PATH}"

    - name: Upload coverage to Codecov
      if: inputs.CODE_COVERAGE
      uses: codecov/codecov-action@v5.4.2
      with:
        files: ${GITHUB_WORKSPACE}/geos_coverage.info.cleaned
        fail_ci_if_error: true
        use_pypi: true
        use_legacy_upload_endpoint: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        SSL_CERT_FILE: /etc/pki/tls/certs/ca-bundle.crt
        REQUESTS_CA_BUNDLE: /etc/pki/tls/certs/ca-bundle.crt
        CURL_CA_BUNDLE: /etc/pki/tls/certs/ca-bundle.crt

    - name: 'Cleanup build folder'
      if: always()
      run: |
        set -euxo pipefail
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:/tmp/geos" \
          alpine:3.20 \
          sh -lc 'rm -rf /tmp/geos/* /tmp/geos/.[!.]* /tmp/geos/..?* || true'

    - name: Show sccache stats
      if: ${{ always() && steps.sccache_config.outputs.sccache_backend == 's3' }}
      env:
        SCCACHE_BUCKET: ${{ steps.sccache_config.outputs.sccache_bucket }}
        AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        SCCACHE_ENDPOINT: ${{ steps.sccache_config.outputs.sccache_endpoint }}
        SCCACHE_S3_USE_SSL: ${{ steps.sccache_config.outputs.sccache_s3_use_ssl }}
        SCCACHE_REGION: ${{ steps.sccache_config.outputs.sccache_region }}
      run: command -v sccache >/dev/null && sccache --show-stats || true
