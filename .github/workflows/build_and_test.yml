name: Build and Test Configuration
on:
  workflow_call:
    inputs:
      BUILD_AND_TEST_CLI_ARGS:
        required: false
        type: string
      BUILD_SHARED_LIBS:
        required: false
        type: string
        default: 'ON'
      BUILD_TYPE:
        required: false
        type: string
        default: build
      CMAKE_BUILD_TYPE:
        required: true
        type: string
      CMAKE_CUDA_ARCHITECTURES:
        required: false
        type: string
        default: ''
      LLVM_SOURCE_COVERAGE:
        required: false
        type: boolean
        default: false
      COVERAGE_BASE_SHA:
        required: false
        type: string
        default: ''
      COVERAGE_HEAD_SHA:
        required: false
        type: string
        default: ''
      CTEST_PARALLEL_LEVEL:
        required: false
        type: string
        default: ''
      DOCKER_IMAGE_TAG:
        required: true
        type: string
      DOCKER_REPOSITORY:
        required: true
        type: string
      DOCKER_RUN_ARGS:
        required: false
        type: string
      ENABLE_HYPRE:
        required: false
        type: string
      ENABLE_HYPREDRV:
        required: false
        type: string
      ENABLE_HYPRE_DEVICE:
        required: false
        type: string
      ENABLE_TRILINOS:
        required: false
        type: string
      GCP_BUCKET:
        required: false
        type: string
      UPLOAD_TO_GCP:
        required: false
        type: boolean
        default: false
      HOST_CONFIG:
        required: false
        type: string
      NPROC:
        required: false
        type: string
        default: ''
      RUNS_ON:
        required: true
        type: string
      SCCACHE_HOST_DIR:
        required: false
        type: string
        default: ''
      USE_SCCACHE:
        required: false
        type: boolean
        default: true
      REQUIRED_LABEL:
        required: false
        type: string
      LOCAL_BASELINE_DIR:
        required: false
        type: string
      BUILD_GENERATOR:
        required: false
        type: string
        default: '--ninja'
      GEOS_ENABLE_BOUNDS_CHECK:
        required: false
        type: string
    secrets:
      GOOGLE_CLOUD_GCP:
        required: false
jobs:
  build_test_deploy:
    runs-on: ${{ inputs.RUNS_ON }}
    steps:
    - name: does_pr_have_necessary_labels
      if: ${{inputs.REQUIRED_LABEL && github.event_name == 'pull_request'}}
      # Fetch labels live from the GitHub REST API rather than reading
      # github.event.pull_request.labels. The event payload is a snapshot
      # frozen at the time the workflow was first triggered, so labels
      # added after that first run are invisible to re-runs. The curl
      # call below always returns current state, which is required for
      # CI re-runs to pick up newly added labels (e.g. "ci: run CUDA
      # builds"). Do not replace with github.event.pull_request.labels.
      # The Authorization header is required for private repos/forks;
      # GITHUB_TOKEN is provided automatically to every workflow run.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        pr_json=$(curl --fail --silent --show-error \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.number }})
        LABELS=$(echo ${pr_json} | jq -crM '[.labels[].name]')
        echo " the labels are ${LABELS}"
        echo " the required label is ${{inputs.REQUIRED_LABEL}}"
        if [[ "${LABELS}" != *"${{inputs.REQUIRED_LABEL}}"* ]]; then
          exit 1
        fi

    - name: 'Cleanup build folder'
      run: |
        pwd
        echo "cleaning ${GITHUB_WORKSPACE}"
        ls -la ./
        rm -rf ./* ./.*|| true
        echo "expecting ${GITHUB_WORKSPACE} to be empty"
        ls -la ./

    - name: Checkout Repository
      uses: actions/checkout@v7.0.0
      with:
        submodules: true
        lfs: ${{ inputs.BUILD_TYPE == 'integrated_tests' }}
        # A coverage PR is built from GitHub's merge commit. Its two parents
        # are needed to attribute coverage to the exact patch that was tested.
        fetch-depth: ${{ inputs.LLVM_SOURCE_COVERAGE && 2 || 1 }}

    - id: 'auth'
      if: ${{ (inputs.UPLOAD_TO_GCP && inputs.GCP_BUCKET) || (inputs.USE_SCCACHE && !startsWith(inputs.RUNS_ON, 'streak2')) }}
      uses: 'google-github-actions/auth@v2.1.10'
      with:
        credentials_json: '${{ secrets.GOOGLE_CLOUD_GCP }}'
        create_credentials_file: true

    - name: 'Set up Cloud SDK'
      if: inputs.UPLOAD_TO_GCP && inputs.GCP_BUCKET
      uses: 'google-github-actions/setup-gcloud@v2.1.4'
      with:
        version: '>= 363.0.0'

    - name: Build, test, deploy.
      env:
        CI_DOCKER_IMAGE_TAG: ${{ inputs.DOCKER_IMAGE_TAG }}
        CI_DOCKER_REPOSITORY: ${{ inputs.DOCKER_REPOSITORY }}
        CI_LLVM_SOURCE_COVERAGE: ${{ inputs.LLVM_SOURCE_COVERAGE }}
        CI_RUNNER_LABEL: ${{ inputs.RUNS_ON }}
        CI_COVERAGE_BASE_SHA: ${{ inputs.COVERAGE_BASE_SHA }}
        CI_COVERAGE_HEAD_SHA: ${{ inputs.COVERAGE_HEAD_SHA }}
        CI_REPOSITORY: ${{ github.repository }}
        # This standard, read-only Actions token is used only by the bounded
        # host-side baseline fetcher and is never passed into Docker.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # Those two bash arrays will be populated depending on the required options,
        # and expended as CLI arguments for the docker and scripts calls.
        docker_args=()
        script_args=()
        DOCKER_IMAGE="${CI_DOCKER_REPOSITORY}:${CI_DOCKER_IMAGE_TAG}"
        DOCKER_RUN_IMAGE="${DOCKER_IMAGE}"

        # Keep the repository mount point consistent between Docker and script args.
        GITHUB_WORKSPACE_MOUNT_POINT=/tmp/geos

        if [[ -n "${{ inputs.NPROC }}" ]]; then
          NPROC=${{ inputs.NPROC }}
          script_args+=(--nproc ${NPROC})
        fi

        if [[ -n "${{ inputs.BUILD_GENERATOR }}" ]]; then
          script_args+=(${{ inputs.BUILD_GENERATOR }})
        fi

        docker_args+=(${{ inputs.DOCKER_RUN_ARGS }})

        COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
        SHORT_COMMIT=${COMMIT:0:7}
        script_args+=(--install-dir-basename GEOS-${SHORT_COMMIT})

        if [[ "${{ inputs.UPLOAD_TO_GCP }}" == "true" && -z "${{ inputs.GCP_BUCKET }}" ]]; then
          echo "::error::UPLOAD_TO_GCP=true requires GCP_BUCKET to be set."
          exit 1
        fi

        DATA_BASENAME=
        DATA_EXCHANGE_DIR=
        if [[ "${{ inputs.BUILD_TYPE }}" = "integrated_tests" ]]; then
          DATA_BASENAME=integratedTests-pr${{ github.event.number }}-${{ github.run_number }}-${SHORT_COMMIT}.tar.gz
          script_args+=(--run-integrated-tests)
        elif [[ "${{ inputs.UPLOAD_TO_GCP }}" == "true" && -n "${{ inputs.GCP_BUCKET }}" ]]; then
          DATA_BASENAME=GEOS-and-TPL-${SHORT_COMMIT}.tar.gz
        fi

        if [[ -n "${DATA_BASENAME}" ]]; then
          script_args+=(--data-basename ${DATA_BASENAME})

          DATA_EXCHANGE_DIR=${GITHUB_WORKSPACE}/geos-exchange  # Exchange folder outside of the container
          mkdir -p ${DATA_EXCHANGE_DIR}
          DATA_EXCHANGE_MOUNT_POINT=/tmp/exchange  # Exchange folder inside of the container
          docker_args+=(--volume=${DATA_EXCHANGE_DIR}:${DATA_EXCHANGE_MOUNT_POINT})
          script_args+=(--exchange-dir ${DATA_EXCHANGE_MOUNT_POINT})
        fi

        HOST_CONFIG=${{ inputs.HOST_CONFIG }}
        script_args+=(${HOST_CONFIG:+"--host-config ${HOST_CONFIG}"})

        if [[ "${{ inputs.USE_SCCACHE }}" == "true" ]]; then
          case "${{ inputs.RUNS_ON }}" in
            streak2*)
              SCCACHE_HOST_DIR="${{ inputs.SCCACHE_HOST_DIR }}"
              if [[ -z "${SCCACHE_HOST_DIR}" ]]; then
                SCCACHE_HOST_DIR=/home/geos-data/sccache
              fi

              mkdir -p "${SCCACHE_HOST_DIR}"
              docker_args+=(--volume=${SCCACHE_HOST_DIR}:/sccache)
              docker_args+=(-e SCCACHE_DIR=/sccache)
              if [[ -n "${SCCACHE_CACHE_SIZE:-}" ]]; then
                docker_args+=(-e SCCACHE_CACHE_SIZE)
              fi
              script_args+=(--use-sccache)
              ;;
            *)
              script_args+=(--sccache-credentials $(basename ${GOOGLE_GHA_CREDS_PATH}))
              ;;
          esac
        fi

        docker_args+=(--volume=${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE_MOUNT_POINT})
        script_args+=(--repository ${GITHUB_WORKSPACE_MOUNT_POINT})

        if [[ "${CI_LLVM_SOURCE_COVERAGE}" == 'true' ]]; then
          coverage_base_sha="${CI_COVERAGE_BASE_SHA}"
          coverage_head_sha="${CI_COVERAGE_HEAD_SHA}"
          if [[ ! "${coverage_head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Coverage head SHA is missing or invalid: ${coverage_head_sha}" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${coverage_head_sha}" ]]; then
            echo "Coverage checkout does not match the tested head SHA." >&2
            exit 1
          fi

          if [[ -n "${coverage_base_sha}" ]]; then
            if [[ ! "${coverage_base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Coverage base SHA is invalid: ${coverage_base_sha}" >&2
              exit 1
            fi
            if ! git cat-file -e "${coverage_base_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${coverage_base_sha}"
            fi
            if ! git cat-file -e "${coverage_base_sha}^{commit}" 2>/dev/null; then
              echo "Coverage base commit is unavailable after fetching it." >&2
              exit 1
            fi
            if [[ "$(git rev-parse "${coverage_head_sha}^1")" != "${coverage_base_sha}" ]]; then
              echo "Coverage base SHA is not the first parent of the tested merge commit." >&2
              exit 1
            fi
          fi

          COVERAGE_ARTIFACT_DIR=$(mktemp -d "${RUNNER_TEMP}/llvm-source-coverage.XXXXXX")
          if [[ ! -d "${COVERAGE_ARTIFACT_DIR}" || -L "${COVERAGE_ARTIFACT_DIR}" ]]; then
            echo "Failed to create a safe LLVM coverage artifact directory." >&2
            exit 1
          fi
          printf 'LLVM_COVERAGE_ARTIFACT_DIR=%s\n' "${COVERAGE_ARTIFACT_DIR}" >> "${GITHUB_ENV}"
          COVERAGE_ARTIFACT_MOUNT_POINT=/tmp/llvm-source-coverage-artifact
          docker_args+=(--volume=${COVERAGE_ARTIFACT_DIR}:${COVERAGE_ARTIFACT_MOUNT_POINT})
          docker pull "${DOCKER_IMAGE}"
          docker_image_id=$(docker image inspect --format '{{.Id}}' "${DOCKER_IMAGE}")
          docker_image_digests=$(docker image inspect --format '{{json .RepoDigests}}' "${DOCKER_IMAGE}")
          DOCKER_RUN_IMAGE="${docker_image_id}"
          docker_args+=(-e "GEOS_CI_CONTAINER_IMAGE=${DOCKER_IMAGE}")
          docker_args+=(-e "GEOS_CI_CONTAINER_IMAGE_ID=${docker_image_id}")
          docker_args+=(-e "GEOS_CI_CONTAINER_IMAGE_DIGESTS=${docker_image_digests}")
          docker_args+=(-e "GEOS_CI_RUNNER_LABEL=${CI_RUNNER_LABEL}")
          script_args+=(--llvm-source-coverage
                        --coverage-output-dir "${COVERAGE_ARTIFACT_MOUNT_POINT}"
                        --coverage-head-sha "${coverage_head_sha}")

          if [[ -n "${coverage_base_sha}" ]]; then
            script_args+=(--coverage-base-sha "${coverage_base_sha}")
            COVERAGE_BASELINE_DIR=$(mktemp -d "${RUNNER_TEMP}/llvm-coverage-baseline.XXXXXX")
            if [[ ! -d "${COVERAGE_BASELINE_DIR}" || -L "${COVERAGE_BASELINE_DIR}" ]]; then
              echo "Failed to create a safe coverage baseline directory." >&2
              exit 1
            fi
            printf 'LLVM_COVERAGE_BASELINE_DIR=%s\n' "${COVERAGE_BASELINE_DIR}" >> "${GITHUB_ENV}"

            set +e
            python3 scripts/fetch_coverage_baseline.py \
              --repository "${CI_REPOSITORY}" \
              --workflow ci_tests.yml \
              --base-sha "${coverage_base_sha}" \
              --artifact-name-prefix llvm-source-coverage-baseline- \
              --token-env GITHUB_TOKEN \
              --output-dir "${COVERAGE_BASELINE_DIR}"
            baseline_fetch_status=$?
            set -e
            case "${baseline_fetch_status}" in
              0)
                baseline_mount=/tmp/llvm-coverage-baseline
                docker_args+=(--volume="${COVERAGE_BASELINE_DIR}:${baseline_mount}:ro")
                script_args+=(--coverage-baseline-summary "${baseline_mount}/coverage-summary.json")
                ;;
              3)
                echo "No trusted exact-base coverage artifact is available; PR patch coverage will still be reported."
                ;;
              *)
                echo "::warning::Coverage baseline lookup failed with status ${baseline_fetch_status}; PR patch coverage will continue without an aggregate delta."
                ;;
            esac
          fi
        fi

        if [ ! -z "${{ inputs.GEOS_ENABLE_BOUNDS_CHECK }}" ]; then
          script_args+=(--geos-enable-bounds-check "${{ inputs.GEOS_ENABLE_BOUNDS_CHECK }}")
        fi
        if [ ! -z "${{ inputs.CMAKE_CUDA_ARCHITECTURES }}" ]; then
          script_args+=(--cmake-cuda-architectures "${{ inputs.CMAKE_CUDA_ARCHITECTURES }}")
        fi

        # The linear algebra environment variables (ENABLE_HYPRE, ENABLE_HYPREDRV,
        # ENABLE_HYPRE_DEVICE & ENABLE_TRILINOS) are passed as script parameters.
        # Specific care must be taken to be sure there's no conflict with the host-config files.

        # Hypre
        ENABLE_HYPRE=${{ inputs.ENABLE_HYPRE }}
        if [ ! -z "${{ inputs.ENABLE_HYPRE }}" ]; then
          script_args+=(--enable-hypre "${{ inputs.ENABLE_HYPRE }}")
        fi

        # Hypredrive is off by default so the TPL image host-config cannot enable it.
        ENABLE_HYPREDRV=${{ inputs.ENABLE_HYPREDRV }}
        if [ ! -z "${{ inputs.ENABLE_HYPREDRV }}" ]; then
          script_args+=(--enable-hypredrv "${{ inputs.ENABLE_HYPREDRV }}")
        fi

        # Trilinos
        ENABLE_TRILINOS=${{ inputs.ENABLE_TRILINOS }}
        docker_args+=(-e ENABLE_HYPRE=${ENABLE_HYPRE:-OFF})
        docker_args+=(-e ENABLE_HYPREDRV=${ENABLE_HYPREDRV:-OFF})
        docker_args+=(-e ENABLE_HYPRE_DEVICE=${ENABLE_HYPRE_DEVICE:-CPU})
        docker_args+=(-e ENABLE_TRILINOS=${ENABLE_TRILINOS:-ON})
        docker_args+=(-e GEOS_BUILD_SHARED_LIBS=${{ inputs.BUILD_SHARED_LIBS }})

        if [ ! -z "${{ inputs.ENABLE_TRILINOS }}" ]; then
          script_args+=(--enable-trilinos "${{ inputs.ENABLE_TRILINOS }}")
        fi

        # ENABLE_HYPRE_DEVICE
        ENABLE_HYPRE_DEVICE=${{ inputs.ENABLE_HYPRE_DEVICE }}
        if [ ! -z "${{ inputs.ENABLE_HYPRE_DEVICE }}" ]; then
          script_args+=(--enable-hypre-device "${{ inputs.ENABLE_HYPRE_DEVICE }}")
        fi

        docker_args+=(--cap-add=SYS_PTRACE --rm)

        script_args+=(--cmake-build-type ${{ inputs.CMAKE_BUILD_TYPE }})
        script_args+=(${{ inputs.BUILD_AND_TEST_CLI_ARGS }})


        DOCKER_REPOSITORY=${CI_DOCKER_REPOSITORY}
        SPLIT_DOCKER_REPOSITORY=(${DOCKER_REPOSITORY//// })
        CONTAINER_NAME=geosx_build_${SPLIT_DOCKER_REPOSITORY[1]}_${GITHUB_SHA:0:7}_${{ inputs.CMAKE_BUILD_TYPE }}
        echo "CONTAINER_NAME: ${CONTAINER_NAME}"
        if [ "$(docker ps -aq -f name=${CONTAINER_NAME})" ]; then
          docker rm -f ${CONTAINER_NAME}
        fi
        docker_args+=(--name ${CONTAINER_NAME})


        if [[ -n "${{ inputs.CTEST_PARALLEL_LEVEL }}" ]]; then
          script_args+=(--ctest-parallel-level "${{ inputs.CTEST_PARALLEL_LEVEL }}")
        fi

        if [[ -n "${{ inputs.LOCAL_BASELINE_DIR }}" ]]; then
          # Extract the 'baseline' value

          # Define the path to the YAML file
          YAML_FILE_PATH="${GITHUB_WORKSPACE}/.integrated_tests.yaml"

          # Verify the YAML file path
          if [[ ! -f "${YAML_FILE_PATH}" ]]; then
            echo "Error: File $YAML_FILE_PATH does not exist."
          else
            echo "Found integratedTests file: $YAML_FILE_PATH."
          fi

          # Extract the baseline field
          BASELINE_FULL_PATH=$(grep -A 2 'baselines:' "${YAML_FILE_PATH}" | grep 'baseline:' | awk '{print $2}')

          # Remove the 'integratedTests/' prefix
          BASELINE_TAG=${BASELINE_FULL_PATH#integratedTests/}
          echo "Baseline: ${BASELINE_TAG}"

          # Extract the folder name
          PR_NUMBER=$(echo "$BASELINE_TAG" | grep -o 'pr[0-9]*')
          PR_BASELINE_FOLDER_NAME=baselines_${PR_NUMBER}
          echo "Baseline folder name: ${PR_BASELINE_FOLDER_NAME}"

          CURRENT_BASELINE_DIR=${{ inputs.LOCAL_BASELINE_DIR }}/${PR_BASELINE_FOLDER_NAME}
          echo "Current baseline dir: ${CURRENT_BASELINE_DIR}"

          if [ -d ${CURRENT_BASELINE_DIR} ];then
            echo "Current baseline dir found."
            ls -l ${CURRENT_BASELINE_DIR}

            # We defined a mount point and mount it read-only inside the container.
            CURRENT_BASELINE_DIR_MOUNT=/tmp/geos/baselines
            docker_args+=(--volume=${CURRENT_BASELINE_DIR}:${CURRENT_BASELINE_DIR_MOUNT}:ro)
          else
            echo "Current baselines directory (${CURRENT_BASELINE_DIR}) not found"
          fi
        fi

        echo running "docker run \
          --user nobody \
          ${docker_args[@]} \
          -h=`hostname` \
          ${DOCKER_RUN_IMAGE} \
          ${GITHUB_WORKSPACE_MOUNT_POINT}/scripts/ci_build_and_test_in_container.sh \
          ${script_args[@]}"

        # In case of integrated tests run, we still want to send the results to the cloud for inspection.
        # While for standard build (if even possible), pushing a failed build would be pointless.
        # GHA set `-e` to bash scripts by default to fail asap,
        # but for this precise call, we want to deal with it more precisely
        set +e
        docker run \
          ${docker_args[@]} \
          -h=`hostname` \
          "${DOCKER_RUN_IMAGE}" \
          ${GITHUB_WORKSPACE_MOUNT_POINT}/scripts/ci_build_and_test_in_container.sh \
          ${script_args[@]}
        EXIT_STATUS=$?
        echo "Received exit status ${EXIT_STATUS} from the build process."
        set -e

        if [[ -n "${DATA_BASENAME}" ]]; then
          if [ -f "${DATA_EXCHANGE_DIR}/${DATA_BASENAME}" ]; then
            echo "Generated artifact at ${DATA_EXCHANGE_DIR}/${DATA_BASENAME}"
          fi

          if [ -f "${DATA_EXCHANGE_DIR}/test_logs_${DATA_BASENAME}" ]; then
            echo "Generated integrated test logs at ${DATA_EXCHANGE_DIR}/test_logs_${DATA_BASENAME}"
          fi

          if [[ -n "${{ inputs.LOCAL_BASELINE_DIR }}" ]]; then
            THIS_PR_NUMBER=pr${{ github.event.number }}
            TARGET_DIR="${{ inputs.LOCAL_BASELINE_DIR }}/baselines_${THIS_PR_NUMBER}"
            mkdir -p "${TARGET_DIR}"

            for file in \
              "${DATA_EXCHANGE_DIR}/baseline_${DATA_BASENAME}" \
              "${DATA_EXCHANGE_DIR}/test_logs_${DATA_BASENAME}"
            do
              if [ -f "${file}" ]; then
                cp "${file}" "${TARGET_DIR}"
                echo "Copied $(basename "${file}") to ${TARGET_DIR}"
              fi
            done
          fi

          if [ ! -f "${DATA_EXCHANGE_DIR}/baseline_${DATA_BASENAME}" ]; then
            echo "No new baseline archive was generated."
          fi
        fi

        if [[ "${{ inputs.UPLOAD_TO_GCP }}" == "true" && -n "${{ inputs.GCP_BUCKET }}" ]]; then
          if [[ "${{ inputs.BUILD_TYPE }}" = "integrated_tests" || ${EXIT_STATUS} -eq 0 ]]; then
            CLOUDSDK_PYTHON=python3 gcloud config set storage/parallel_composite_upload_enabled True

            for file in \
              "${DATA_EXCHANGE_DIR}/${DATA_BASENAME}" \
              "${DATA_EXCHANGE_DIR}/test_logs_${DATA_BASENAME}" \
              "${DATA_EXCHANGE_DIR}/baseline_${DATA_BASENAME}"
            do
              if [ -f "${file}" ]; then
                CLOUDSDK_PYTHON=python3 gcloud storage cp --quiet -a publicRead "${file}" gs://${{ inputs.GCP_BUCKET }}/
                echo "Uploaded https://storage.googleapis.com/${{ inputs.GCP_BUCKET }}/$(basename "${file}")"
              fi
            done
          fi
        else
          echo "GCP upload disabled."
        fi

        if [[ "${CI_LLVM_SOURCE_COVERAGE}" == 'true' &&
              -n "${COVERAGE_BASELINE_DIR:-}" &&
              -f "${COVERAGE_BASELINE_DIR}/coverage-baseline-status.json" &&
              ! -L "${COVERAGE_BASELINE_DIR}/coverage-baseline-status.json" ]]; then
          cp -- "${COVERAGE_BASELINE_DIR}/coverage-baseline-status.json" \
                "${COVERAGE_ARTIFACT_DIR}/coverage-baseline-status.json"
        fi

        exit ${EXIT_STATUS}

    - name: Validate compact LLVM coverage report
      id: validate_llvm_coverage_artifact
      if: ${{ always() && inputs.LLVM_SOURCE_COVERAGE }}
      run: |
        if [[ -z "${LLVM_COVERAGE_ARTIFACT_DIR:-}" ||
              ! -d "${LLVM_COVERAGE_ARTIFACT_DIR}" ||
              -L "${LLVM_COVERAGE_ARTIFACT_DIR}" ]]; then
          echo "LLVM coverage artifact directory is missing or unsafe." >&2
          exit 1
        fi
        unsafe_link=$(find "${LLVM_COVERAGE_ARTIFACT_DIR}" -type l -print -quit)
        if [[ -n "${unsafe_link}" ]]; then
          echo "LLVM coverage artifact contains a symbolic link: ${unsafe_link}" >&2
          exit 1
        fi
        unexpected_path=$(find "${LLVM_COVERAGE_ARTIFACT_DIR}" -mindepth 1 ! -type f -print -quit)
        if [[ -n "${unexpected_path}" ]]; then
          echo "LLVM coverage artifact contains a non-file entry: ${unexpected_path}" >&2
          exit 1
        fi
        while IFS= read -r artifact_file; do
          case "$(basename -- "${artifact_file}")" in
            CMakeCache.txt|branch-summary.txt|coverage-baseline-status.json|coverage-objects.txt|coverage-status.md|coverage-summary.json|coverage-summary.md|ctest.log|llvm-summary.json|mapping-integrity.log|native-export.log|pr-coverage.json|pr-coverage.md|summary-export.log|toolchain.txt) ;;
            *)
              echo "Unexpected LLVM coverage artifact: ${artifact_file}" >&2
              exit 1
              ;;
          esac
        done < <(find "${LLVM_COVERAGE_ARTIFACT_DIR}" -mindepth 1 -maxdepth 1 -type f -print)
        artifact_bytes=$(find "${LLVM_COVERAGE_ARTIFACT_DIR}" -type f -printf '%s\n' \
          | awk '{ total += $1 } END { print total + 0 }')
        if (( artifact_bytes > 50 * 1024 * 1024 )); then
          echo "LLVM coverage artifact is too large: ${artifact_bytes} bytes" >&2
          exit 1
        fi

    - name: Publish LLVM coverage summary
      if: ${{ always() && inputs.LLVM_SOURCE_COVERAGE }}
      env:
        CI_COVERAGE_ARTIFACT_VALIDATION: ${{ steps.validate_llvm_coverage_artifact.outcome }}
        CI_COVERAGE_BASE_SHA: ${{ inputs.COVERAGE_BASE_SHA }}
      run: |
        printf '## LLVM source coverage\n\n' >> "${GITHUB_STEP_SUMMARY}"
        if [[ "${CI_COVERAGE_ARTIFACT_VALIDATION}" != success ]]; then
          {
            printf '### ❌ Coverage results unavailable\n\n'
            printf '| Validation | Result | Details |\n'
            printf '|---|:---:|---|\n'
            printf '| Compact report artifact | ❌ Failed | Artifact validation failed; inspect the job log |\n'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        status_report="${LLVM_COVERAGE_ARTIFACT_DIR}/coverage-status.md"
        metrics_report="${LLVM_COVERAGE_ARTIFACT_DIR}/coverage-summary.md"
        if [[ -f "${status_report}" && ! -L "${status_report}" ]]; then
          cat "${status_report}" >> "${GITHUB_STEP_SUMMARY}"
        else
          {
            printf '### ❌ Coverage results unavailable\n\n'
            printf '| Validation | Result | Details |\n'
            printf '|---|:---:|---|\n'
            printf '| Build, test, and report | ❌ Failed | No status report was produced; inspect the job log |\n\n'
          } >> "${GITHUB_STEP_SUMMARY}"
        fi
        if [[ -f "${metrics_report}" && ! -L "${metrics_report}" ]]; then
          cat "${metrics_report}" >> "${GITHUB_STEP_SUMMARY}"
        else
          {
            printf '### Coverage metrics unavailable\n\n'
            printf 'The job did not produce a validated coverage report. Inspect the build and report logs.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
        fi
        if [[ -n "${CI_COVERAGE_BASE_SHA}" ]]; then
          pr_report="${LLVM_COVERAGE_ARTIFACT_DIR}/pr-coverage.md"
          if [[ -f "${pr_report}" && ! -L "${pr_report}" ]]; then
            printf '\n' >> "${GITHUB_STEP_SUMMARY}"
            cat "${pr_report}" >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              printf '\n### PR coverage unavailable\n\n'
              printf 'The patch-specific report was not produced; inspect the job log.\n'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
        fi

    - name: Retain compact LLVM coverage report
      if: ${{ always() && inputs.LLVM_SOURCE_COVERAGE && steps.validate_llvm_coverage_artifact.outcome == 'success' }}
      uses: actions/upload-artifact@v4.6.2
      with:
        name: llvm-source-coverage-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/CMakeCache.txt
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/branch-summary.txt
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/coverage-baseline-status.json
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/coverage-objects.txt
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/coverage-status.md
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/coverage-summary.json
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/coverage-summary.md
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/ctest.log
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/llvm-summary.json
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/mapping-integrity.log
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/native-export.log
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/pr-coverage.json
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/pr-coverage.md
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/summary-export.log
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/toolchain.txt
        if-no-files-found: warn
        retention-days: 7

    - name: Retain trusted develop coverage baseline
      if: ${{ success() && inputs.LLVM_SOURCE_COVERAGE && github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.validate_llvm_coverage_artifact.outcome == 'success' }}
      uses: actions/upload-artifact@v4.6.2
      with:
        name: llvm-source-coverage-baseline-${{ github.sha }}
        path: |
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/coverage-summary.json
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/llvm-summary.json
          ${{ env.LLVM_COVERAGE_ARTIFACT_DIR }}/toolchain.txt
        if-no-files-found: error
        overwrite: true
        retention-days: 90

    - name: Remove temporary LLVM coverage files
      if: ${{ always() && inputs.LLVM_SOURCE_COVERAGE }}
      run: |
        if [[ -n "${LLVM_COVERAGE_ARTIFACT_DIR:-}" &&
              -d "${LLVM_COVERAGE_ARTIFACT_DIR}" &&
              ! -L "${LLVM_COVERAGE_ARTIFACT_DIR}" ]]; then
          docker run --rm \
            --volume="${LLVM_COVERAGE_ARTIFACT_DIR}:/tmp/coverage-artifact" \
            alpine:3.20 \
            sh -lc 'find /tmp/coverage-artifact -mindepth 1 -delete'
          rmdir "${LLVM_COVERAGE_ARTIFACT_DIR}"
        fi
        if [[ -n "${LLVM_COVERAGE_BASELINE_DIR:-}" &&
              -d "${LLVM_COVERAGE_BASELINE_DIR}" &&
              ! -L "${LLVM_COVERAGE_BASELINE_DIR}" ]]; then
          find "${LLVM_COVERAGE_BASELINE_DIR}" -mindepth 1 -maxdepth 1 -type f -delete
          rmdir "${LLVM_COVERAGE_BASELINE_DIR}"
        fi

    - name: Show sccache summary
      if: ${{ always() && inputs.USE_SCCACHE }}
      run: |
        SCCACHE_STATS_FILE="${GITHUB_WORKSPACE}/.sccache-runtime/stats.txt"
        if [[ -f "${SCCACHE_STATS_FILE}" ]]; then
          grep -E '^(Compile requests|Cache hits|Cache misses|Cache timeouts|Cache read errors|Cache write errors|Compilation failures|Cache errors|Non-cacheable compilations|Non-cacheable calls|Cache location|Cache size|Max cache size|Version \(client\))' "${SCCACHE_STATS_FILE}" || cat "${SCCACHE_STATS_FILE}"
        else
          echo "No in-container sccache stats file was captured."
        fi

    - name: 'Cleanup build folder'
      if: always()
      run: |
        set -euxo pipefail
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:/tmp/geos" \
          alpine:3.20 \
          sh -lc 'rm -rf /tmp/geos/* /tmp/geos/.[!.]* /tmp/geos/..?* || true'
