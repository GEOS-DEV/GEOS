name: macOS

on:
  push:
    branches:
      - ci/paludettomag1/macos
  workflow_dispatch:

jobs:
  build_macos:
    name: macOS 26 - Apple Clang (arm64)
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_ANALYTICS: 1

    steps:
    - name: Checkout GEOS
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        lfs: false

    - name: Checkout thirdPartyLibs
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: GEOS-DEV/thirdPartyLibs
        ref: ci/paludettomag1/macos
        path: thirdPartyLibs
        submodules: true
        lfs: true

    - name: Set up Python for Uberenv
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Set up build environment
      run: |
        python3 -m pip install clingo
        echo "SPACK_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
        echo "GEOSX_TPL_DIR=$RUNNER_TEMP/geos-tpls" >> "$GITHUB_ENV"
        echo "SPACK_CONFIG=$RUNNER_TEMP/geosx-macos-spack.yaml" >> "$GITHUB_ENV"
        echo "GEOS_BUILD_DIR=$RUNNER_TEMP/geos-build" >> "$GITHUB_ENV"

    - name: Prepare Homebrew dependencies
      working-directory: thirdPartyLibs
      run: |
        unset HOMEBREW_NO_INSTALL_UPGRADE HOMEBREW_NO_INSTALL_CLEANUP
        brew update
        python3 - <<'PY'
        import json
        import subprocess

        with open('scripts/spack_configs/macOS/homebrew-manifest.json') as stream:
            formulae = [entry['name'] for entry in json.load(stream)['formulae']]
        installed = subprocess.check_output(['brew', 'list', '--formula'], text=True).split()
        if 'mpich' in installed and 'open-mpi' in formulae:
            formulae.remove('open-mpi')
        subprocess.run(['brew', 'install', '--formula', *formulae], check=True)
        PY
        bash scripts/setupMacOS-TPL-deps.bash --spack-config-out "$SPACK_CONFIG"

    - name: Build macOS TPLs
      working-directory: thirdPartyLibs
      run: |
        python3 scripts/uberenv/uberenv.py \
          --project-json="$GITHUB_WORKSPACE/thirdPartyLibs/.uberenv_config.json" \
          --package-source-dir="$GITHUB_WORKSPACE" \
          --spack-env-file="$SPACK_CONFIG" \
          --prefix="$GEOSX_TPL_DIR" \
          --spec="~pygeosx ~docs ~openmp %c,cxx=apple-clang %fortran=gcc@16.2.0" \
          -j 2

    - name: Build GEOS
      run: |
        host_config=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.cmake' -print -quit)
        test -n "$host_config"
        python3 scripts/config-build.py -hc "$host_config" -bt Release --buildpath "$GEOS_BUILD_DIR"
        cmake --build "$GEOS_BUILD_DIR" -j 2 --target geosx
