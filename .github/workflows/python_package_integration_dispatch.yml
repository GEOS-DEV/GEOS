name: Python Package Integration (Repository Dispatch)

on:
  repository_dispatch:
    types: [python-package-integration-test]

jobs:
  validate_geos_integration:
    runs-on: ubuntu-22.04
    if: github.event.action == 'python-package-integration-test'
    outputs:
      DOCKER_IMAGE_TAG: ${{ steps.extract_docker_image_tag.outputs.DOCKER_IMAGE_TAG }}
    
    steps:
    - name: Log dispatch event
      run: |
        echo "Received repository dispatch for python package integration test"
        echo "Target branch: ${{ github.event.client_payload.target_branch }}"
        echo "Python package repo: ${{ github.event.client_payload.python_package_repo }}"
        echo "Python package branch: ${{ github.event.client_payload.python_package_branch }}"
        echo "Python package PR: ${{ github.event.client_payload.python_package_pr }}"
        echo "Requested by: ${{ github.event.client_payload.requested_by }}"

    # Checkout the target branch (where the integration test workflow exists)
    - name: Checkout GEOS Repository
      uses: actions/checkout@v4.2.2
      with:
        ref: ${{ github.event.client_payload.target_branch }}
        submodules: true
        fetch-depth: 1

    # Extract docker image tag from the target branch
    - name: Extract docker image tag
      id: extract_docker_image_tag
      run: |
        if [ -f ".devcontainer/devcontainer.json" ]; then
          DOCKER_TAG=$(jq '.build.args.GEOS_TPL_TAG' -r .devcontainer/devcontainer.json)
          echo "DOCKER_IMAGE_TAG=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using Docker tag: ${DOCKER_TAG}"
        else
          echo "DOCKER_IMAGE_TAG=latest" >> "$GITHUB_OUTPUT"
          echo "devcontainer.json not found, using latest tag"
        fi

  python_integration_test:
    needs: [validate_geos_integration]
    uses: ./.github/workflows/python_integration_test.yml
    secrets: inherit
    with:
      PYTHON_PACKAGE_REPO: ${{ github.event.client_payload.python_package_repo }}
      PYTHON_PACKAGE_BRANCH: ${{ github.event.client_payload.python_package_branch }}
      DOCKER_IMAGE_TAG: ${{ needs.validate_geos_integration.outputs.DOCKER_IMAGE_TAG }}
      DOCKER_REPOSITORY: geosx/ubuntu22.04-gcc12
      RUNS_ON: ubuntu-22.04

  report_results:
    needs: [python_integration_test]
    runs-on: ubuntu-22.04
    if: always()
    steps:
    - name: Report results
      run: |
        echo "Python package integration test completed"
        echo "Python package repo: ${{ github.event.client_payload.python_package_repo }}"
        echo "Python package branch: ${{ github.event.client_payload.python_package_branch }}"
        echo "Python package PR: ${{ github.event.client_payload.python_package_pr }}"
        echo "Test Result: ${{ needs.python_integration_test.result }}"
        
        if [[ "${{ needs.python_integration_test.result }}" == "success" ]]; then
          echo "✅ Integration test PASSED"
          echo "The geosPythonPackages changes are compatible with GEOS"
        else
          echo "❌ Integration test FAILED"
          echo "The geosPythonPackages changes may break GEOS functionality"
          exit 1
        fi
