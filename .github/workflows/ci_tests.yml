name: GEOS CI 

on: 
  push:
    branches: 
      - develop
  pull_request:
      types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancels in-progress workflows for a PR when updated
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Please define `build.args.GEOS_TPL_TAG` in `.devcontainer/devcontainer.json`

jobs:
  # Jobs will be cancelled if PR is a draft.
  # PR status must be "Open" to run CI.
  is_not_draft_pull_request:
    # if: ${{ always() }}
    # Everywhere in this workflow, we use the most recent ubuntu distribution available in Github Actions.
    runs-on: ubuntu-22.04
    outputs:
      DOCKER_IMAGE_TAG: ${{ steps.extract_docker_image_tag.outputs.DOCKER_IMAGE_TAG }}
    steps:
    - name: Check that the PR is not a draft (cancel rest of jobs otherwise)
      id: extract_pr_info
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          draft_status="${{ github.event.pull_request.draft }}"

          echo "Draft status of PR is ${draft_status}."
          if [[ "${draft_status}" == "true" ]]; then
            exit 1
          fi
        fi

        
    # The TPL tag is contained in the codespaces configuration to avoid duplications.
    - name: Checkout .devcontainer/devcontainer.json
      uses: actions/checkout@v4.2.2
      with:
        sparse-checkout: |
          .devcontainer/devcontainer.json
        sparse-checkout-cone-mode: false
        submodules: false
        lfs: false
        fetch-depth: 1
    - name: Extract docker image tag
      id: extract_docker_image_tag
      run: |
        echo "DOCKER_IMAGE_TAG=$(jq '.build.args.GEOS_TPL_TAG' -r .devcontainer/devcontainer.json)" >> "$GITHUB_OUTPUT"

  # Resolve CI settings once and keep the build jobs declarative.
  # Source of truth for organization-specific behavior:
  #   .github/ci/orgs/<github.repository_owner>.json
  # That file selects the storage provider, sccache profile, integrated-tests upload path,
  # and runner labels used by the matrix jobs below. Each runner entry may be either a single
  # label string or a full GitHub Actions runs-on label list.
  # Provider backend behavior can still be extended via vars.CI_PROVIDER_CONFIG_JSON.
  # Provider payloads are supplied generically through inherited secrets:
  # - SCCACHE_PROFILES_JSON
  # - ARTIFACT_PROVIDER_CREDENTIALS_JSON
  # Direct one-off overrides remain available in the reusable workflow via SCCACHE_* and
  # ARTIFACT_UPLOAD_CREDENTIALS_JSON.
  resolve_ci_provider:
    runs-on: ubuntu-22.04
    outputs:
      STORAGE_PROVIDER: ${{ steps.resolve.outputs.STORAGE_PROVIDER }}
      SCCACHE_PROFILE: ${{ steps.resolve.outputs.SCCACHE_PROFILE }}
      INTEGRATED_TESTS_ARTIFACT_BUCKET_PATH: ${{ steps.resolve.outputs.INTEGRATED_TESTS_ARTIFACT_BUCKET_PATH }}
      RUNNER_LABELS_JSON: ${{ steps.resolve.outputs.RUNNER_LABELS_JSON }}
      ARTIFACT_UPLOAD_COMMAND: ${{ steps.resolve.outputs.ARTIFACT_UPLOAD_COMMAND }}
      ARTIFACT_UPLOAD_PRE_COMMAND: ${{ steps.resolve.outputs.ARTIFACT_UPLOAD_PRE_COMMAND }}
      ARTIFACT_UPLOAD_URI_ROOT: ${{ steps.resolve.outputs.ARTIFACT_UPLOAD_URI_ROOT }}
      ARTIFACT_PUBLIC_URL_ROOT: ${{ steps.resolve.outputs.ARTIFACT_PUBLIC_URL_ROOT }}
    env:
      CI_REPOSITORY_OWNER: ${{ github.repository_owner }}
      CI_STORAGE_PROVIDER: ${{ vars.CI_STORAGE_PROVIDER || '' }}
      CI_SCCACHE_PROFILE: ${{ vars.CI_SCCACHE_PROFILE || '' }}
      CI_INTEGRATED_TESTS_ARTIFACT_BUCKET_PATH: ${{ vars.CI_INTEGRATED_TESTS_ARTIFACT_BUCKET_PATH || '' }}
      CI_PROVIDER_CONFIG_JSON: ${{ vars.CI_PROVIDER_CONFIG_JSON || '' }}
      CLOUDFLARE_ARTIFACT_PUBLIC_URL_BASE: ${{ vars.CLOUDFLARE_ARTIFACT_PUBLIC_URL_BASE || vars.CLOUDFLARE_ARTIFACT_PUBLIC_URL_PREFIX || '' }}
    steps:
    - name: Checkout CI org config
      uses: actions/checkout@v4.2.2
      with:
        sparse-checkout: |
          .github/ci/orgs
        sparse-checkout-cone-mode: false
        submodules: false
        lfs: false
        fetch-depth: 1
    - id: resolve
      run: |
        set -euo pipefail

        REPOSITORY_OWNER_LOWER="$(printf '%s' "${CI_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
        ORG_CONFIG_PATH=''
        for candidate in \
          "${GITHUB_WORKSPACE}/.github/ci/orgs/${CI_REPOSITORY_OWNER}.json" \
          "${GITHUB_WORKSPACE}/.github/ci/orgs/${REPOSITORY_OWNER_LOWER}.json"
        do
          if [[ -f "${candidate}" ]]; then
            ORG_CONFIG_PATH="${candidate}"
            break
          fi
        done

        if [[ -z "${ORG_CONFIG_PATH}" ]]; then
          echo "::error::No CI organization config was found for repository owner '${CI_REPOSITORY_OWNER}'. Expected .github/ci/orgs/${CI_REPOSITORY_OWNER}.json or .github/ci/orgs/${REPOSITORY_OWNER_LOWER}.json."
          exit 1
        fi

        if ! jq -e 'type == "object"' "${ORG_CONFIG_PATH}" >/dev/null; then
          echo "::error::Invalid JSON object in ${ORG_CONFIG_PATH}."
          exit 1
        fi

        ORG_CONFIG_JSON="$(jq -c . "${ORG_CONFIG_PATH}")"

        if ! jq -e '
          (.storage_provider | type == "string" and length > 0)
          and (.sccache_profile | type == "string" and length > 0)
          and (.integrated_tests_artifact_bucket_path | type == "string" and length > 0)
          and (.runners | type == "object")
          and (.runners.default | type == "string" and length > 0)
          and (.runners.cpu_heavy | type == "string" and length > 0)
          and (.runners.integrated_tests | type == "string" and length > 0)
          and (.runners.code_coverage | type == "string" and length > 0)
          and (.runners.cuda | type == "string" and length > 0)
        ' <<< "${ORG_CONFIG_JSON}" >/dev/null; then
          echo "::error::${ORG_CONFIG_PATH} must define storage_provider, sccache_profile, integrated_tests_artifact_bucket_path, and runners.{default,cpu_heavy,integrated_tests,code_coverage,cuda}. Each runner value must be a non-empty string."
          exit 1
        fi

        SELECTED_ORG_STORAGE_PROVIDER="$(jq -r '.storage_provider' <<< "${ORG_CONFIG_JSON}")"
        SELECTED_ORG_SCCACHE_PROFILE="$(jq -r '.sccache_profile' <<< "${ORG_CONFIG_JSON}")"
        SELECTED_ORG_INTEGRATED_TESTS_ARTIFACT_BUCKET_PATH="$(jq -r '.integrated_tests_artifact_bucket_path' <<< "${ORG_CONFIG_JSON}")"
        RUNNER_LABELS_JSON="$(jq -c '.runners' <<< "${ORG_CONFIG_JSON}")"

        STORAGE_PROVIDER="${CI_STORAGE_PROVIDER:-${SELECTED_ORG_STORAGE_PROVIDER}}"

        if [[ -n "${CI_SCCACHE_PROFILE}" ]]; then
          SCCACHE_PROFILE="${CI_SCCACHE_PROFILE}"
        elif [[ -n "${CI_STORAGE_PROVIDER}" ]]; then
          SCCACHE_PROFILE="${STORAGE_PROVIDER}"
        else
          SCCACHE_PROFILE="${SELECTED_ORG_SCCACHE_PROFILE:-${STORAGE_PROVIDER}}"
        fi

        INTEGRATED_TESTS_ARTIFACT_BUCKET_PATH="${CI_INTEGRATED_TESTS_ARTIFACT_BUCKET_PATH:-${SELECTED_ORG_INTEGRATED_TESTS_ARTIFACT_BUCKET_PATH:-geosx/integratedTests}}"

        DEFAULT_PROVIDER_CONFIG_JSON="$(jq -cn --arg cloudflare_artifact_public_url_base "${CLOUDFLARE_ARTIFACT_PUBLIC_URL_BASE}" '
          {
            gcp: {
              artifact_upload_command: "CLOUDSDK_PYTHON=python3 gcloud storage cp --quiet -a publicRead \"$UPLOAD_SRC\" \"$UPLOAD_DST\"",
              artifact_upload_pre_command: "if [[ -z \"$ARTIFACT_UPLOAD_CREDENTIALS_FILE\" || ! -f \"$ARTIFACT_UPLOAD_CREDENTIALS_FILE\" ]]; then echo \"ARTIFACT_UPLOAD_CREDENTIALS_FILE is required when artifact upload is enabled.\" >&2; exit 1; fi; if ! command -v python3 >/dev/null; then echo \"python3 is required for gcp artifact upload backend.\" >&2; exit 1; fi; if ! python3 -c 'import json, sys; json.load(open(sys.argv[1]))' \"$ARTIFACT_UPLOAD_CREDENTIALS_FILE\" >/dev/null 2>&1; then echo \"::error::Invalid JSON in artifact upload credentials file.\" >&2; exit 1; fi; CLOUDSDK_PYTHON=python3 gcloud auth activate-service-account --key-file \"$ARTIFACT_UPLOAD_CREDENTIALS_FILE\"; CLOUDSDK_PYTHON=python3 gcloud config set storage/parallel_composite_upload_enabled True",
              artifact_upload_uri_root: "gs://",
              artifact_public_url_root: "https://storage.googleapis.com"
            },
            cloudflare: {
              artifact_upload_command: "aws s3 cp --only-show-errors \"$UPLOAD_SRC\" \"$UPLOAD_DST\" --endpoint-url \"$ARTIFACT_UPLOAD_ENDPOINT\"",
              artifact_upload_pre_command: "if [[ -z \"$ARTIFACT_UPLOAD_CREDENTIALS_FILE\" || ! -f \"$ARTIFACT_UPLOAD_CREDENTIALS_FILE\" ]]; then echo \"ARTIFACT_UPLOAD_CREDENTIALS_FILE is required when artifact upload is enabled.\" >&2; exit 1; fi; if ! command -v aws >/dev/null; then echo \"aws CLI is required for cloudflare artifact upload backend.\" >&2; exit 1; fi; if ! command -v python3 >/dev/null; then echo \"python3 is required for cloudflare artifact upload backend.\" >&2; exit 1; fi; ACCESS_KEY_ID=\"$(python3 -c 'import json, sys; data=json.load(open(sys.argv[1])); value=data.get(\"access_key_id\", \"\"); print(value if isinstance(value, str) else \"\")' \"$ARTIFACT_UPLOAD_CREDENTIALS_FILE\")\"; SECRET_ACCESS_KEY=\"$(python3 -c 'import json, sys; data=json.load(open(sys.argv[1])); value=data.get(\"secret_access_key\", \"\"); print(value if isinstance(value, str) else \"\")' \"$ARTIFACT_UPLOAD_CREDENTIALS_FILE\")\"; ENDPOINT=\"$(python3 -c 'import json, sys; data=json.load(open(sys.argv[1])); value=data.get(\"endpoint\", \"\"); print(value if isinstance(value, str) else \"\")' \"$ARTIFACT_UPLOAD_CREDENTIALS_FILE\")\"; if [[ -z \"$ACCESS_KEY_ID\" || -z \"$SECRET_ACCESS_KEY\" || -z \"$ENDPOINT\" ]]; then echo \"::error::Cloudflare artifact upload credentials must include access_key_id, secret_access_key, and endpoint.\" >&2; exit 1; fi; export AWS_ACCESS_KEY_ID=\"$ACCESS_KEY_ID\"; export AWS_SECRET_ACCESS_KEY=\"$SECRET_ACCESS_KEY\"; export AWS_DEFAULT_REGION=\"${AWS_DEFAULT_REGION:-auto}\"; export AWS_EC2_METADATA_DISABLED=true; export ARTIFACT_UPLOAD_ENDPOINT=\"$ENDPOINT\"",
              artifact_upload_uri_root: "s3://",
              artifact_public_url_root: $cloudflare_artifact_public_url_base
            }
          }
        ')"

        CUSTOM_PROVIDER_CONFIG_JSON="${CI_PROVIDER_CONFIG_JSON:-}"
        if [[ -n "${CUSTOM_PROVIDER_CONFIG_JSON}" ]]; then
          echo "${CUSTOM_PROVIDER_CONFIG_JSON}" | jq -e 'type == "object"' >/dev/null
        else
          CUSTOM_PROVIDER_CONFIG_JSON='{}'
        fi

        PROVIDER_CONFIG_JSON="$(jq -cn \
          --argjson defaults "${DEFAULT_PROVIDER_CONFIG_JSON}" \
          --argjson custom "${CUSTOM_PROVIDER_CONFIG_JSON}" \
          '$defaults * $custom'
        )"

        SELECTED_PROVIDER_JSON="$(jq -cer --arg provider "${STORAGE_PROVIDER}" '.[$provider]' <<< "${PROVIDER_CONFIG_JSON}")" || {
          echo "::error::No provider configuration was found for '${STORAGE_PROVIDER}'."
          exit 1
        }

        ARTIFACT_UPLOAD_COMMAND="$(jq -er '.artifact_upload_command' <<< "${SELECTED_PROVIDER_JSON}")"
        ARTIFACT_UPLOAD_PRE_COMMAND="$(jq -er '.artifact_upload_pre_command // ""' <<< "${SELECTED_PROVIDER_JSON}")"
        ARTIFACT_UPLOAD_URI_ROOT="$(jq -er '.artifact_upload_uri_root' <<< "${SELECTED_PROVIDER_JSON}")"
        ARTIFACT_PUBLIC_URL_ROOT="$(jq -er '.artifact_public_url_root // ""' <<< "${SELECTED_PROVIDER_JSON}")"

        {
          echo "STORAGE_PROVIDER=${STORAGE_PROVIDER}"
          echo "SCCACHE_PROFILE=${SCCACHE_PROFILE}"
          echo "INTEGRATED_TESTS_ARTIFACT_BUCKET_PATH=${INTEGRATED_TESTS_ARTIFACT_BUCKET_PATH}"
          echo "RUNNER_LABELS_JSON=${RUNNER_LABELS_JSON}"
          echo "ARTIFACT_UPLOAD_COMMAND<<__EOF__"
          printf '%s\n' "${ARTIFACT_UPLOAD_COMMAND}"
          echo "__EOF__"
          echo "ARTIFACT_UPLOAD_PRE_COMMAND<<__EOF__"
          printf '%s\n' "${ARTIFACT_UPLOAD_PRE_COMMAND}"
          echo "__EOF__"
          echo "ARTIFACT_UPLOAD_URI_ROOT=${ARTIFACT_UPLOAD_URI_ROOT}"
          echo "ARTIFACT_PUBLIC_URL_ROOT=${ARTIFACT_PUBLIC_URL_ROOT}"
        } >> "$GITHUB_OUTPUT"

  # PR must be assigned to be merged.
  # This job will fail if this is not the case.
  if_not_unassigned_pull_request:
    needs: [is_not_draft_pull_request]
    runs-on: ubuntu-22.04
    steps:
    - name: If this is a PR, Check that it is assigned
      run: |
        set -euo pipefail

        if [[ ${{github.event_name}} != 'pull_request' ]]; then exit 0 ; fi
        pr_json='${{ toJson(github.event.pull_request) }}'
        NUM_ASSIGNEES=$(jq -r '.assignees | length' <<< "${pr_json}")
        echo "There are ${NUM_ASSIGNEES} assignees on this PR."
        if [[ $NUM_ASSIGNEES == 0 ]]; then exit 1 ; fi

  # Validates that the PR is still pointing to the HEAD of the main branch of the submodules repositories.
  # (There are exceptions, read the script about those).
  are_submodules_in_sync:
    needs: [is_not_draft_pull_request]
    runs-on: ubuntu-22.04
    steps:
    # The integrated test submodule repository contains large data (using git lfs).
    # To save time (and money) we do not let Github Actions automatically clone all our (lfs) subrepositories and do it by hand.
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2
      with:
        # Let script update submodules; Github Actions submodule history causes error
        submodules: false
        lfs: false
        fetch-depth: 1
    - name: Check that submodules are up to date
      run: "scripts/test_submodule_updated.sh"

  check_code_style_and_documentation:
    name: ${{ matrix.name }}
    needs: [is_not_draft_pull_request]
    strategy:
      fail-fast : false
      matrix:
        include:
        # Validates the code-style using uncrustify
        - name: Check code style
          BUILD_AND_TEST_ARGS: --test-code-style
        # Validates that the documentation generated using doxygen has no hole.
        - name: Check documentation
          BUILD_AND_TEST_ARGS: --test-documentation
    uses: ./.github/workflows/build_and_test.yml
    with:
      BUILD_AND_TEST_CLI_ARGS: ${{ matrix.BUILD_AND_TEST_ARGS }}
      CMAKE_BUILD_TYPE: Release
      DOCKER_IMAGE_TAG: ${{ needs.is_not_draft_pull_request.outputs.DOCKER_IMAGE_TAG }}
      HOST_CONFIG: /spack-generated.cmake
      DOCKER_REPOSITORY: geosx/ubuntu20.04-gcc9
      RUNS_ON: ubuntu-22.04
      USE_SCCACHE: false

  # Matrix containing all the CPU build.
  # Those are quite fast and can efficiently benefit from the `sccache' tool to make them even faster.
  cpu_builds:
    name: ${{ matrix.name }}
    needs: [is_not_draft_pull_request, resolve_ci_provider]
    strategy:
      # In-progress jobs will not be cancelled if there is a failure
      fail-fast : false
      matrix:
        include:
          - name: Ubuntu (20.04, gcc 9.4.0, open-mpi 4.0.3)
            CMAKE_BUILD_TYPE: Release
            DOCKER_REPOSITORY: geosx/ubuntu20.04-gcc9
            BUILD_SHARED_LIBS: ON
            ENABLE_HYPRE: OFF
            ENABLE_TRILINOS: ON
            GEOS_ENABLE_BOUNDS_CHECK: ON
            HOST_CONFIG: /spack-generated.cmake

          - name: Ubuntu debug (20.04, gcc 10.5.0, open-mpi 4.0.3) - github codespaces
            BUILD_AND_TEST_CLI_ARGS: "--no-run-unit-tests"
            CMAKE_BUILD_TYPE: Debug
            DOCKER_REPOSITORY: geosx/ubuntu20.04-gcc10
            BUILD_SHARED_LIBS: ON
            ENABLE_HYPRE: OFF
            ENABLE_TRILINOS: ON
            GEOS_ENABLE_BOUNDS_CHECK: ON
            # Resolved from .github/ci/orgs/<github.repository_owner>.json.
            RUNNER_KEY: cpu_heavy
            NPROC: 8
            DOCKER_RUN_ARGS: "--cpus=8 --memory=256g -v /etc/pki/tls/certs/ca-bundle.crt:/etc/pki/tls/certs/ca-bundle.crt:ro -v /etc/pki/tls/certs/ca-bundle.crt:/certs/ca-bundle.crt:ro"

            HOST_CONFIG: /spack-generated.cmake

          - name: Ubuntu (20.04, gcc 10.5.0, open-mpi 4.0.3) - github codespaces
            CMAKE_BUILD_TYPE: Release
            DOCKER_REPOSITORY: geosx/ubuntu20.04-gcc10
            BUILD_SHARED_LIBS: ON
            ENABLE_HYPRE: OFF
            ENABLE_TRILINOS: ON
            GEOS_ENABLE_BOUNDS_CHECK: ON
            HOST_CONFIG: /spack-generated.cmake

          - name: Ubuntu (22.04, gcc 11.4.0, open-mpi 4.1.2)
            CMAKE_BUILD_TYPE: Release
            DOCKER_REPOSITORY: geosx/ubuntu22.04-gcc11
            ENABLE_HYPRE: ON
            ENABLE_TRILINOS: OFF
            BUILD_SHARED_LIBS: ON
            GEOS_ENABLE_BOUNDS_CHECK: OFF
            HOST_CONFIG: /spack-generated.cmake

          - name: Ubuntu (22.04, gcc 12.3.0, open-mpi 4.1.2)
            CMAKE_BUILD_TYPE: Release
            DOCKER_REPOSITORY: geosx/ubuntu22.04-gcc12
            ENABLE_HYPRE: ON
            ENABLE_TRILINOS: OFF
            BUILD_SHARED_LIBS: ON
            GEOS_ENABLE_BOUNDS_CHECK: ON
            HOST_CONFIG: /spack-generated.cmake

          - name: Ubuntu (22.04, gcc 12.3.0, open-mpi 4.1.2, +hypredrive)
            CMAKE_BUILD_TYPE: Release
            DOCKER_REPOSITORY: geosx/ubuntu22.04-gcc12-hypredrive
            ENABLE_HYPRE: ON
            ENABLE_TRILINOS: OFF
            BUILD_SHARED_LIBS: ON
            GEOS_ENABLE_BOUNDS_CHECK: ON
            HOST_CONFIG: /spack-generated.cmake

          - name: Ubuntu (22.04, gcc 12.3.0, open-mpi 4.1.2) - NO BOUNDS CHECK
            CMAKE_BUILD_TYPE: Release
            DOCKER_REPOSITORY: geosx/ubuntu22.04-gcc12
            ENABLE_HYPRE: ON
            ENABLE_TRILINOS: OFF
            BUILD_SHARED_LIBS: ON
            GEOS_ENABLE_BOUNDS_CHECK: OFF
            HOST_CONFIG: /spack-generated.cmake


    uses: ./.github/workflows/build_and_test.yml
    with:
      BUILD_AND_TEST_CLI_ARGS: ${{ matrix.BUILD_AND_TEST_CLI_ARGS || '' }}
      BUILD_SHARED_LIBS: ${{ matrix.BUILD_SHARED_LIBS }}
      CMAKE_BUILD_TYPE: ${{ matrix.CMAKE_BUILD_TYPE }}
      DOCKER_IMAGE_TAG: ${{ needs.is_not_draft_pull_request.outputs.DOCKER_IMAGE_TAG }}
      DOCKER_REPOSITORY: ${{ matrix.DOCKER_REPOSITORY }}
      DOCKER_RUN_ARGS: ${{ matrix.DOCKER_RUN_ARGS || '' }}
      ENABLE_HYPRE: ${{ matrix.ENABLE_HYPRE }}
      ENABLE_TRILINOS: ${{ matrix.ENABLE_TRILINOS }}
      GEOS_ENABLE_BOUNDS_CHECK: ${{ matrix.GEOS_ENABLE_BOUNDS_CHECK }}
      STORAGE_PROVIDER: ${{ needs.resolve_ci_provider.outputs.STORAGE_PROVIDER }}
      SCCACHE_PROFILE: ${{ needs.resolve_ci_provider.outputs.SCCACHE_PROFILE }}
      HOST_CONFIG: ${{ matrix.HOST_CONFIG }}
      NPROC: ${{ matrix.NPROC || '' }}
      RUNS_ON: ${{ fromJSON(needs.resolve_ci_provider.outputs.RUNNER_LABELS_JSON)[matrix.RUNNER_KEY || 'default'] }}
    secrets: inherit

  # If the 'ci: run integrated tests' PR label is found, the integrated tests will be run immediately after the cpu jobs.
  # Note: The integrated tests are optional and are (for the moment) run for convenience only.
  run_integrated_tests:
    needs:
      - is_not_draft_pull_request
      - resolve_ci_provider
      - cpu_builds
    uses: ./.github/workflows/build_and_test.yml
    secrets: inherit
    with:
      BUILD_AND_TEST_CLI_ARGS: --build-exe-only
      BUILD_TYPE: integrated_tests
      CMAKE_BUILD_TYPE: Release
      DOCKER_IMAGE_TAG: ${{ needs.is_not_draft_pull_request.outputs.DOCKER_IMAGE_TAG }}
      DOCKER_REPOSITORY: geosx/ubuntu22.04-gcc12
      ENABLE_HYPRE: ON
      ENABLE_TRILINOS: OFF
      GEOS_ENABLE_BOUNDS_CHECK: ON
      STORAGE_PROVIDER: ${{ needs.resolve_ci_provider.outputs.STORAGE_PROVIDER }}
      SCCACHE_PROFILE: ${{ needs.resolve_ci_provider.outputs.SCCACHE_PROFILE }}
      ARTIFACT_UPLOAD_BUCKET_PATH: ${{ needs.resolve_ci_provider.outputs.INTEGRATED_TESTS_ARTIFACT_BUCKET_PATH }}
      ARTIFACT_UPLOAD_COMMAND: ${{ needs.resolve_ci_provider.outputs.ARTIFACT_UPLOAD_COMMAND }}
      ARTIFACT_UPLOAD_PRE_COMMAND: ${{ needs.resolve_ci_provider.outputs.ARTIFACT_UPLOAD_PRE_COMMAND }}
      ARTIFACT_UPLOAD_URI_ROOT: ${{ needs.resolve_ci_provider.outputs.ARTIFACT_UPLOAD_URI_ROOT }}
      ARTIFACT_PUBLIC_URL_ROOT: ${{ needs.resolve_ci_provider.outputs.ARTIFACT_PUBLIC_URL_ROOT }}
      RUNS_ON: ${{ fromJSON(needs.resolve_ci_provider.outputs.RUNNER_LABELS_JSON).integrated_tests }}
      NPROC: 32
      DOCKER_RUN_ARGS: "--cpus=32 --memory=384g -v /etc/pki/tls/certs/ca-bundle.crt:/etc/pki/tls/certs/ca-bundle.crt:ro -v /etc/pki/tls/certs/ca-bundle.crt:/certs/ca-bundle.crt:ro"
      REQUIRED_LABEL: "ci: run integrated tests"
      LOCAL_BASELINE_DIR: /data/GEOS/baselines
      HOST_CONFIG: /spack-generated.cmake

  baseline_log:
    needs: [is_not_draft_pull_request]
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2
      with:
        submodules: false
        lfs: false
        fetch-depth: 0
        sparse-checkout: |
          scripts
    - name: Check that the baseline logs are modified if rebaselines are detected
      run: "scripts/check_baseline_log.sh"

  code_coverage:
    needs:
      - is_not_draft_pull_request
      - resolve_ci_provider
    uses: ./.github/workflows/build_and_test.yml
    secrets: inherit
    with:
      BUILD_AND_TEST_CLI_ARGS: "--no-run-unit-tests"
      CMAKE_BUILD_TYPE: Debug
      CODE_COVERAGE: true
      DOCKER_IMAGE_TAG: ${{ needs.is_not_draft_pull_request.outputs.DOCKER_IMAGE_TAG }}
      DOCKER_REPOSITORY: geosx/ubuntu22.04-gcc11
      ENABLE_HYPRE: ON
      ENABLE_TRILINOS: OFF
      SCCACHE_PROFILE: ${{ needs.resolve_ci_provider.outputs.SCCACHE_PROFILE }}
      RUNS_ON: ${{ fromJSON(needs.resolve_ci_provider.outputs.RUNNER_LABELS_JSON).code_coverage }}
      REQUIRED_LABEL: "ci: run code coverage"
      HOST_CONFIG: /spack-generated.cmake
      NPROC: 8
      DOCKER_RUN_ARGS: "--cpus=8 --memory=256g -v /etc/pki/tls/certs/ca-bundle.crt:/etc/pki/tls/certs/ca-bundle.crt:ro -v /etc/pki/tls/certs/ca-bundle.crt:/certs/ca-bundle.crt:ro"


  # mac_builds:
  #   needs:
  #     - is_not_draft_pull_request
  #   runs-on: macos-14-xlarge
  #   steps:
  #     - run: sysctl -n hw.physicalcpu
  #     - run: sysctl -h hw.memsize
  #     - run: sysctl -n machdep.cpu.brand_string


  # If the 'ci: run CUDA builds' PR label is found, the cuda jobs run immediately along side linux jobs.
  # Note: CUDA jobs should only be run if PR is ready to merge.
  cuda_builds:
    name: ${{ matrix.name }}
    needs:
      - is_not_draft_pull_request
      - resolve_ci_provider
    strategy:
      # In-progress jobs will not be cancelled if there is a failure
      fail-fast : false
      matrix:
        include:
          - name: Ubuntu CUDA debug (20.04, clang 10.0.0 + gcc 9.4.0, open-mpi 4.0.3, cuda-11.8.89)
